name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build extension
        run: npm run build

      # The unpacked extension is what you actually load into Chrome, so keep it
      # downloadable from the PR rather than making reviewers build it.
      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: callpilot-unpacked-${{ github.sha }}
          path: dist/
          retention-days: 14
